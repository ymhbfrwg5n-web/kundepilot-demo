<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KundePilot | Bedriftsportal</title><style>body{margin:0;font:16px system-ui;background:#f2f6fb;color:#182c45}header{background:#142c4a;color:white;padding:22px}main{max-width:900px;margin:auto;padding:24px}section{background:white;padding:25px;border-radius:16px;margin:16px 0}input,button,textarea{font:inherit;padding:12px;border-radius:9px;border:1px solid #c4d1de;box-sizing:border-box}input,textarea{width:100%;margin:7px 0 14px}button{background:#1769bd;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}label{display:block;font-weight:650}p{color:#56697c}article{border:1px solid #e0e7ef;border-radius:12px;padding:15px;margin:12px 0}small{color:#65798c}a{color:#1769bd}</style></head><body><header><strong>KundePilot</strong> · Bedriftsportal (lukket test)</header><main><section id="login"><h1>Logg inn</h1><p>Kun inviterte testbrukere. Ingen offentlig registrering eller innsending av ekte kundeopplysninger.</p><form id="loginform"><label>E-post</label><input id="email" type="email" autocomplete="username" required><label>Passord</label><input id="password" type="password" autocomplete="current-password" required><button>Logg inn</button></form><p id="authstatus" role="status"></p></section><section id="dashboard" hidden><h1>Forespørsler</h1><p id="who"></p><button id="logout">Logg ut</button><p id="status" role="status">Laster ...</p><div id="items"></div></section><p><a href="./">Tilbake til offentlig demo</a></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const sb=createClient('https://upckkdkqkqriagyygadv.supabase.co','sb_publishable_xipt98RvN2vbqiQYjz7eXg_jTijBmOk',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const e=id=>document.getElementById(id);let current=null;
async function render(){const {data:{user},error}=await sb.auth.getUser();current=user;if(error||!user){e('login').hidden=false;e('dashboard').hidden=true;return}e('login').hidden=true;e('dashboard').hidden=false;e('who').textContent='Innlogget: '+user.email;await load();}
async function load(){e('status').textContent='Laster forespørsler ...';e('items').replaceChildren();const {data,error}=await sb.from('kp_inquiries').select('id,customer_name,origin_address,destination_address,move_date,status,created_at,reply_draft').order('created_at',{ascending:false}).limit(100);if(error){e('status').textContent='Kunne ikke hente forespørsler: '+error.message;return}e('status').textContent=data.length+' forespørsler';for(const item of data){const box=document.createElement('article');const heading=document.createElement('h3');heading.textContent=item.customer_name+' · '+item.origin_address+' → '+item.destination_address;box.append(heading);const detail=document.createElement('p');detail.textContent='Dato: '+(item.move_date||'Ukjent')+' · Status: '+item.status;box.append(detail);const label=document.createElement('label');label.textContent='Svarutkast';box.append(label);const area=document.createElement('textarea');area.value=item.reply_draft||'';area.rows=5;box.append(area);const save=document.createElement('button');save.textContent='Lagre svarutkast';save.onclick=async()=>{save.disabled=true;const {error}=await sb.from('kp_inquiries').update({reply_draft:area.value}).eq('id',item.id);save.textContent=error?'Feil: '+error.message:'Lagret';save.disabled=false};box.append(save);e('items').append(box)}}
e('loginform').onsubmit=async ev=>{ev.preventDefault();e('authstatus').textContent='Logger inn ...';const {error}=await sb.auth.signInWithPassword({email:e('email').value,password:e('password').value});if(error){e('authstatus').textContent='Innlogging feilet: '+error.message;return}e('password').value='';e('authstatus').textContent='';await render()};
e('logout').onclick=async()=>{await sb.auth.signOut();await render()};render();
</script></body></html>
